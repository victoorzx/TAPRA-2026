name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python3 --version

      - name: Instalar ferramentas de qualidade
        run: pip install flake8 black isort

      - name: Verificar sintaxe
        run: python3 -m py_compile function_app.py

      - name: Verificar ordem dos imports (isort)
        run: isort --profile black --check-only --diff function_app.py

      - name: Verificar formatação (black)
        run: black --check --diff function_app.py

      - name: Linting (flake8)
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 function_app.py

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: "funcapp-tapra-victorbatista"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          remote-build: true